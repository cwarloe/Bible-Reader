[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selftalk"
version = "0.1.0"
description = "Script-to-audio pipeline for Helmstetter-pattern self-talk sessions"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "pydub>=0.25.1"]

[project.scripts]
selftalk = "selftalk.cli:main"

[tool.setuptools]
packages = ["selftalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
