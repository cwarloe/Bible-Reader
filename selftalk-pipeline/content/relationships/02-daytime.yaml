slug: relationships-02-daytime
title: "Relationships & Love — Daytime Drill"
suite: relationships
track_type: daytime
perspective: first_person
source: "1 Corinthians 13:4-8, Ephesians 4:2-3, 32, Romans 12:9-18, John 15:13"
target_minutes: 6

pacing:
  noise_pad_gain_db: -10

blocks:
  - id: opening-tone
    repeat: 1
    text: |
      [warm, confident, direct — speaking to someone you believe in]
      I love well. I am not alone.

  - id: loved-first
    text: "I am loved by God — patiently, kindly, and without condition. That is the foundation I love others from."

  - id: patient-and-kind
    text: "I am patient and kind. I do not envy, I do not boast, I am not easily offended or self-seeking."

  - id: no-record
    text: "I do not keep a record of wrongs. I let go of offenses before they become walls."

  - id: bear-with-others
    text: "I bear with others in all humility and gentleness. I make every effort to keep the bond of peace."

  - id: forgive
    text: "I forgive others as God in Christ has forgiven me. Forgiveness flows through me because so much has been forgiven in me."

  - id: sincere
    text: "My love for others is sincere — not performed, not transactional, but genuine and consistent."

  - id: present
    text: "I am present with the people God has placed in my life. I show up. I listen. I pay attention."

  - id: lay-down
    text: "I lay down my life for those I love — in the daily, unglamorous acts of choosing people over convenience."

  - id: not-alone
    text: "I am not alone. I belong to God first, and through that, to the people He has placed in my life."

  - id: peace
    text: "As far as it depends on me, I live at peace with everyone. I do not carry offense or stir up conflict."

  - id: invest
    text: "I invest in relationships. Every act of real love builds something that accumulates and lasts."

  - id: commitment-anchor
    text: "Each time I hear these words, I reinforce the truth that I am loved and that I love others well. That is who I am."

  - id: closing-anchor
    text: "I love well. I am not alone."

synthesis:
  id: synthesis-you
  text: |
    [natural rhythm, grounded conviction]
    You love well. You are not alone.
    You are loved by God — patiently, kindly, and without condition. That is the foundation you love others from. You are patient and kind. You do not keep a record of wrongs. You let go of offenses before they become walls.
    You bear with others in all humility and gentleness. You make every effort to keep the bond of peace. You forgive as God in Christ has forgiven you — because so much has been forgiven in you.
    Your love for others is sincere — not performed, not transactional. You are present with the people God has placed in your life. You show up. You listen. You pay attention.
    You lay down your life in the daily, unglamorous acts of choosing people over convenience. You live at peace as far as it depends on you.
    You are not alone. You belong to God first, and through that, to the people He has placed in your life.
    Every act of real love builds something that accumulates and lasts. You invest in relationships because you know their worth.
    Each time you hear these words, you reinforce the truth: you are loved, and you love others well. That is who you are.
    You love well. You are not alone.
