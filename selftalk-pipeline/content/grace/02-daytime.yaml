slug: grace-02-daytime
title: "Grace & Forgiveness — Daytime Drill"
suite: grace
track_type: daytime
perspective: first_person
source: "Ephesians 2:1-10, Romans 5:1-11, 8:1, 1 John 1:9, Psalm 103"
target_minutes: 6

pacing:
  noise_pad_gain_db: -10

blocks:
  - id: opening-tone
    repeat: 1
    text: |
      [warm, confident, direct — speaking to someone you believe in]
      I am fully forgiven and walking in grace.

  - id: forgiven
    text: "I am fully forgiven — not partially, not provisionally. My sins are gone as far as the east is from the west."

  - id: justified
    text: "I am justified by faith. I am declared righteous before God — not by my performance, but by grace."

  - id: no-condemnation
    text: "There is no condemnation for me. None. I am free from the weight of guilt and shame."

  - id: not-on-probation
    text: "I am not on probation with God. I am not earning my way back. I am already accepted."

  - id: saved-by-grace
    text: "I am saved by grace through faith — not by works. This is the gift of God. I cannot add to it."

  - id: peace-with-god
    text: "I have peace with God through Jesus Christ. That peace is settled and it does not depend on my feelings."

  - id: access
    text: "I have direct access to God — right now, as I am. I approach Him with confidence, not with shame."

  - id: compassion
    text: "God is compassionate and gracious toward me. He knows how I am formed. He is for me, not against me."

  - id: no-record
    text: "God does not keep a record of my wrongs. He does not hold my failures over me. They are gone."

  - id: grace-motivates
    text: "Grace is not an excuse — it is the power to become who I was created to be. I live well because I am already loved."

  - id: it-is-finished
    text: "It is finished. The price has been paid. Nothing I do today can add to or take away from what Christ accomplished."

  - id: commitment-anchor
    text: "Each time I hear these words and let them settle, I replace the lie that I have to earn my place. I am accepted. I am free. I walk in grace."

  - id: closing-anchor
    text: "I am fully forgiven and walking in grace."

synthesis:
  id: synthesis-you
  text: |
    [natural rhythm, grounded conviction]
    You are fully forgiven and walking in grace.
    You are justified by faith — declared righteous, not by your performance, but by grace. Your sins are gone as far as the east is from the west. God does not hold them over you. He does not keep a record.
    There is no condemnation for you. None. You are not on probation. You are not earning your way back. You are already accepted.
    You have been saved by grace through faith — not by works. It is the gift of God, and you cannot add to it or lose it through your performance.
    You have peace with God. You have direct access to Him — right now, as you are. You approach Him with confidence, not with shame.
    God is compassionate and gracious toward you. He knows how you are formed. He is for you.
    Grace is not an excuse. It is the power to become who you were created to be. You live well because you are already loved.
    It is finished. The price has been paid. Nothing you do today can add to or subtract from what Christ has already accomplished on your behalf.
    Each time you hear these words and let them settle, you replace the lie that you have to earn your place. You are accepted. You are free. You walk in grace.
    You are fully forgiven and walking in grace.
