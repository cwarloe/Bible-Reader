slug: mind-02-daytime
title: "Mind & Thought Life — Daytime Drill"
suite: mind
track_type: daytime
perspective: first_person
source: "Romans 12:2, Philippians 4:8, 2 Corinthians 10:3-5, Isaiah 26:3, Colossians 3:2"
target_minutes: 6

pacing:
  noise_pad_gain_db: -10

blocks:
  - id: opening-tone
    repeat: 1
    text: |
      [warm, confident, direct — speaking to someone you believe in]
      My mind is being renewed. I think well.

  - id: renewed
    text: "My mind is being transformed by renewal. My thinking is getting clearer and more aligned with truth every day."

  - id: take-captive
    text: "I take every thought captive and make it obedient to Christ. I do not let lies run unchallenged."

  - id: intentional
    text: "I am intentional about what I dwell on. I choose what stays in my mind and what gets redirected."

  - id: what-is-true
    text: "I fix my mind on what is true, honorable, just, pure, lovely, and commendable. That is where my attention lives."

  - id: not-conformed
    text: "I do not conform to the patterns of the world's thinking. I think differently. I see things differently."

  - id: set-above
    text: "I set my mind on things above. My perspective is anchored higher than my circumstances."

  - id: perfect-peace
    text: "I keep my mind stayed on God, and He keeps me in perfect peace. Peace follows my focus."

  - id: strongholds-down
    text: "I have the power to demolish strongholds — patterns of lying thought that have tried to build themselves into my mind. They come down."

  - id: not-my-feelings
    text: "My feelings are real, but they are not always true. I do not let my emotions override what I know to be fact."

  - id: mind-of-christ
    text: "I have the mind of Christ. I am learning to live out of it more fully every single day."

  - id: redirect
    text: "When my mind drifts toward fear, comparison, or self-condemnation, I notice it and I redirect. That is the skill I am building."

  - id: commitment-anchor
    text: "Each time I hear these words, I reinforce new thought patterns and weaken old ones. My mind is being renewed and truth is winning."

  - id: closing-anchor
    text: "My mind is being renewed. I think well."

synthesis:
  id: synthesis-you
  text: |
    [natural rhythm, grounded conviction]
    Your mind is being renewed. You think well.
    You are being transformed by the renewing of your mind — your thinking is getting clearer and more aligned with truth every day. You do not conform to the patterns of the world's thinking. You think differently.
    You take every thought captive and make it obedient to Christ. You do not let lies run unchallenged. You notice them, name them, and replace them with what is actually true.
    You fix your mind on what is true, honorable, just, pure, lovely, and commendable. You set your mind on things above. Your perspective is anchored higher than your circumstances.
    You keep your mind stayed on God, and He keeps you in perfect peace. Peace follows your focus.
    You have the power to demolish strongholds — patterns of lying thought that have tried to build themselves into your mind. They come down.
    You have the mind of Christ. You are learning to live out of it more fully every day.
    When your mind drifts toward fear, comparison, or self-condemnation, you notice and redirect. That is the skill you are building — and you are getting better at it.
    Each time you hear these words, you reinforce new patterns and weaken old ones. Your mind is being renewed and truth is winning.
    Your mind is being renewed. You think well.
