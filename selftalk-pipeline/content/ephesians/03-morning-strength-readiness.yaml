slug: eph-03-morning-strength-readiness
title: "Ephesians 6 — Spiritual Strength & Readiness"
suite: ephesians
track_type: morning
perspective: second_person
source: "Ephesians 6:10-24"
target_minutes: 8

blocks:
  - id: opening-frame
    text: |
      [warm, confident, direct — speaking to someone you believe in]
      These are the programs you choose to have... about yourself... and your spiritual strength, armor, and readiness.

  - id: recognition
    text: |
      You choose to recognize that you are strong in the Lord, and in the strength of His mighty power. You believe in the divine armor you have been given, and you live out that strength in every challenge you face. You choose to be in charge of your own readiness and vigilance. How you stand your ground is up to you, and no one else.

  - id: mirror-check
    text: |
      When you look at yourself in the mirror, you see yourself as being strong, watchful, equipped, and unshakeable. You see yourself as someone who stands firm, faces opposition with clarity, and walks in continuous victory.

  - id: cultivation
    text: |
      You choose to be a person who takes the time to prepare your mind and spirit for every situation. You understand the critical importance of spiritual discipline, vigilance, and perseverance.

  - id: tricolon-armor
    text: |
      [natural rhythm, grounded conviction]
      You take up the armor.
      You stand your ground.
      And you remain unshakeable.

  - id: no-fear
    text: |
      You choose to never fear opposition, and you never fear the schemes of the enemy. You know that each day you learn to stand firmer, and every trial is a stepping stone along the way. You are a victor in Christ. Your strength, courage, and spiritual readiness are a natural, everyday part of your life.

  - id: time-well-spent
    text: |
      You really enjoy walking in the strength of the Lord. You know that you deserve the time it takes to build the spiritual power and resilience you choose to have. Every moment you spend anchoring your mind in truth is time that is always well spent.

  - id: personal-strength
    text: |
      Along with standing firm in faith, you always add to your personal strength of character. You build self-reliance, moral resolve, and spiritual authority in everything you do.

  - id: descriptor-series
    text: |
      [clear emphasis, genuine energy]
      An accurate description of the person you choose to be would include the words: strong... watchful... courageous... grounded... protected... disciplined... prayerful... aware of your authority... and standing firm every day.

  - id: the-real-battle
    text: |
      You recognize clearly where the true battle lies. You choose not to wrestle against flesh and blood, or against people and circumstances. You understand the spiritual forces at work, and you stand fully equipped in heavenly strength.

  - id: full-armor
    text: |
      You take up the full armor of God so that you can withstand in the day of difficulty, and having done everything, to stand firm.

  - id: armor-pieces
    note: "Piece by piece, one line each — the pacing is the point."
    text: |
      [grounded and energetic]
      You fasten the belt of truth securely around your waist.
      You put on the breastplate of righteousness to guard your heart.
      You fit your feet with the readiness of the gospel of peace, standing ready on solid ground.

  - id: shield
    text: |
      In all circumstances, you take up the shield of faith. You know with certainty that it extinguishes every flaming dart, every lie, and every doubt sent your way.

  - id: helmet-and-sword
    text: |
      You place upon your head the helmet of salvation to protect your thoughts.
      And you take up the sword of the Spirit... which is the living and active word of God.

  - id: trials-into-victory
    text: |
      [warm and direct]
      You choose to be a person who turns every trial into an opportunity for victory. You make the most of every situation you encounter. You are steadfast in your own stand, but you are also actively praying for and supporting the endurance of others.

  - id: prayer
    text: |
      You choose to pray at all times in the Spirit, with all kinds of prayers and requests. You stay alert with complete perseverance, lifting up your brothers and sisters in faithful intercession.

  - id: bold-speech
    text: |
      You choose to speak boldly. You open your mouth with confidence, clarity, and courage to make known the truth of the gospel.

  - id: tricolon-stand
    text: |
      [natural, unhurried rhythm]
      You do not retreat.
      You do not waver.
      You stand firm.

  - id: every-day
    text: |
      [confident and energetic]
      Every day, you put on the armor.
      Every day, you grow stronger in His might.

  - id: investment
    text: |
      You believe in investing in your spiritual readiness. The resilience, peace, and steadfast character you build are always worth the effort you put in. Standing firm in the Lord comes naturally, automatically, and powerfully to you.

  - id: knowing
    text: |
      You know what you stand for, you know the armor you wear, you know where your strength comes from, and you know that it is all up to you.

  - id: closing-anchor
    text: |
      Those are the programs you choose to have about your spiritual strength and readiness. You already know the truth: you are fully equipped... you are strong in the Lord... and today is a great day to prove it.
