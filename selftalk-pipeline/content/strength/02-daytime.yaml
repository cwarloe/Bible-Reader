slug: strength-02-daytime
title: "Strength & Perseverance — Daytime Drill"
suite: strength
track_type: daytime
perspective: first_person
source: "Philippians 4:13, Isaiah 40:31, Hebrews 12:1-3, 2 Corinthians 12:9, Galatians 6:9"
target_minutes: 6

pacing:
  noise_pad_gain_db: -10

blocks:
  - id: opening-tone
    repeat: 1
    text: |
      [warm, confident, direct — speaking to someone you believe in]
      I am strong. I do not quit.

  - id: can-do-all-things
    text: "I can do all things through Christ who strengthens me. That strength is available to me right now."

  - id: renewed
    text: "I wait on the Lord and He renews my strength. I mount up. I run and do not grow weary. I walk and do not faint."

  - id: weak-then-strong
    text: "When I am weak, then I am strong. My weakness is not an obstacle — it is where God's power shows up."

  - id: grace-sufficient
    text: "His grace is sufficient for me. I do not have to be enough on my own. I show up to the One who is."

  - id: not-done
    text: "I am not done. I am not finished. I have what it takes — not because of me, but because of who is in me."

  - id: lay-aside
    text: "I lay aside every weight that slows me down. I do not carry yesterday into today. I run free."

  - id: do-not-give-up
    text: "I do not grow weary of doing good. In due season I will reap — if I do not give up. So I do not give up."

  - id: fixed-on-jesus
    text: "I fix my eyes on Jesus — who endured more than I will ever face and finished. That is my model and my strength."

  - id: not-defined-by-setbacks
    text: "I am not defined by my setbacks, my failures, or my worst days. I am defined by the One who is renewing me."

  - id: press-on
    text: "I press on toward what is ahead. I do not dwell on what is behind me. Forward is the direction I move."

  - id: consistent
    text: "I show up consistently — even when results are not visible, even when progress is slow. Every step builds something real."

  - id: commitment-anchor
    text: "Each time I hear these words, I reinforce my capacity to endure. I draw on strength that is not my own, and it is more than enough."

  - id: closing-anchor
    text: "I am strong. I do not quit."

synthesis:
  id: synthesis-you
  text: |
    [natural rhythm, grounded conviction]
    You are strong. You do not quit.
    You can do all things through Christ who strengthens you. That strength is available to you right now — not when you feel better, not when circumstances improve. Right now.
    Those who wait on the Lord renew their strength. You mount up. You run and do not grow weary. You walk and do not faint.
    When you are weak, you are strong. Your weakness is not an obstacle — it is where God's power shows up most clearly.
    His grace is sufficient for you. You do not have to be enough on your own. You show up to the One who is.
    You are not done. You are not finished. You lay aside every weight and you run — free, focused, forward.
    You do not grow weary of doing good. In due season you will reap — if you do not give up. So you do not give up.
    You fix your eyes on Jesus — who endured more than you will ever face and finished. That is your model and your strength.
    You are not defined by your setbacks or your failures. You press on toward what is ahead.
    Each time you hear these words, you reinforce your capacity to endure. You draw on strength that is not your own — and it is more than enough.
    You are strong. You do not quit.
