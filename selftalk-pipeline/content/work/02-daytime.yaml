slug: work-02-daytime
title: "Work as Holy Calling — Daytime Drill"
suite: work
track_type: daytime
perspective: first_person
source: "Ephesians 6:5-9, Colossians 3:23-24, Genesis 1:28, Matthew 25:21"
target_minutes: 6

pacing:
  noise_pad_gain_db: -10

blocks:
  - id: opening-tone
    repeat: 1
    text: |
      [warm, confident, direct — speaking to someone you believe in]
      My work is holy. I am on mission today.

  - id: not-a-layman
    text: "I am not just a layman doing secular work. I am one of the saints through whom the wisdom of God is made known."

  - id: mission-field
    text: "My workplace is my mission field. I go to work as a person on assignment from God."

  - id: as-to-the-lord
    text: "Whatever I do, I do it wholeheartedly — as to the Lord and not for human approval. I work for an audience of One."

  - id: holy-calling
    text: "My daily work is a holy calling. When I steward my work with excellence, I carry out God's original design for humanity."

  - id: formed-by-hard
    text: "I welcome the hardships that come through my work as instruments God uses to form Christ in me."

  - id: servant-at-work
    text: "I serve the people around me at work — with integrity, genuine care, and the presence of someone who carries something they need."

  - id: not-paycheck
    text: "My work is not just a paycheck. I hold what I earn with an open hand, converting it into purposes that outlast my career."

  - id: not-my-god
    text: "My work is not my god. I work hard and I rest well. I know how to hold both."

  - id: ultimate-employer
    text: "God is my ultimate employer. He sees my sincerity, my integrity, and the quality of what I bring — every day."

  - id: full-time-service
    text: "I am in full-time service to God. My ministry does not start on Sunday — it runs all week, wherever I am placed."

  - id: well-done
    text: "I work faithfully toward the day I hear: Well done. You were faithful with a few things. Enter into the joy of your Master."

  - id: commitment-anchor
    text: "Each time I hear these words, I reinforce the truth that my work matters eternally. I show up today as someone on assignment from God."

  - id: closing-anchor
    text: "My work is holy. I am on mission today."

synthesis:
  id: synthesis-you
  text: |
    [natural rhythm, grounded conviction]
    Your work is holy. You are on mission today.
    You are not just a layman doing secular work. You are one of the saints through whom the wisdom of God is made known. Your workplace is your mission field, and you go to it as a person on assignment from God.
    Whatever you do, you do it wholeheartedly — as to the Lord and not for human approval. You work for an audience of One. Your performance review is not the final word. God sees your sincerity, your integrity, and the quality of what you bring.
    Your daily work is a holy calling. When you steward it with excellence, you carry out God's original design. You welcome the hard seasons as instruments God uses to form Christ in you.
    You serve the people around you — with integrity, genuine care, and the presence of someone who carries something they cannot name but can feel.
    Your work is not your god. You hold what you earn with an open hand, converting it into purposes that outlast your career.
    You are in full-time service to God. Your ministry runs all week, wherever you are placed.
    You work faithfully toward the day you hear: Well done. You were faithful with a few things. Enter into the joy of your Master.
    Each time you hear these words, you reinforce the truth that your work matters eternally. You show up today as someone on assignment from God.
    Your work is holy. You are on mission today.
