# Global defaults. Per-track defaults live in selftalk/config.py (TRACK_PRESETS);
# a single program can override anything here in its own `voice:`/`pacing:` block.

elevenlabs:
  # Find yours at https://elevenlabs.io/app/voice-lab -> the voice -> ID.
  voice_id: "YXtimK1Uha5A2ZzZpoAq"
  model_id: "eleven_v3"
  # Robust end of the slider: keeps the measured, unhurried cadence and stops
  # the model speeding up through long descriptor lists.
  stability: 0.63
  similarity_boost: 0.80
  # Raised from 0.05 — adds warmth and natural energy without going theatrical.
  style: 0.17
  speed: 1.0

pacing:
  # Leave these unset to use the per-track-type presets, which is the norm.
  # Anything set here applies to every program in the library.
  pause_transition_ms: 3500   # before a daytime synthesis coda
  pause_tag_ms: 700           # what one [pause] tag is worth when estimating
  # Pad added before and after every raw take at assembly time.
  # When a noise sample can be extracted from the batch (the normal case),
  # these pads are filled with the clip's own ambient noise floor (~-64 dBFS)
  # rather than absolute silence, so there is no perceptible dead-air gap.
  # Each pad fades at BOTH edges: the clip-facing edge cross-fades with the
  # clip's own fade (see below); the gap-facing edge fades to/from silence
  # over gap_fade_ms so there is no hard wall between noise and dead air.
  # 80 ms gives comfortable room for both fades; raise toward 125 ms if
  # generation-edge artefacts return.
  clip_lead_ms: 80            # noise-textured pad before the speech starts
  clip_tail_ms: 80            # noise-textured pad after the speech ends
  # Short linear amplitude ramp applied to the raw clip (not the padding) so
  # the waveform always reaches zero at the clip edge.  The fade is inaudible
  # as attack/release at these durations but eliminates click discontinuities.
  clip_fade_in_ms: 15         # 15 ms fade-in on every raw take
  clip_fade_out_ms: 25        # 25 ms fade-out on every raw take
  # Fade applied at the gap-facing (silence-facing) edge of each noise pad.
  # Without this the pad abruptly drops to absolute silence at the inter-block
  # pause, which the ear hears as a hard cutoff.  40 ms feels smooth without
  # shortening the breathing-room pauses perceptibly.
  gap_fade_ms: 40             # noise→silence and silence→noise fade duration

audio:
  output_format: "mp3"
  bitrate: "192k"

paths:
  raw_dir: "output/raw_takes"
  master_dir: "output/master"
